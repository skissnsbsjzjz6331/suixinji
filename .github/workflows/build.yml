name: Build mobile apps

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android standard + Huawei
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build installable debug APKs
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleStandardDebug assembleHuaweiDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: suixinji-android-standard-v1.0.3
          path: android/app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: suixinji-android-huawei-v1.0.3
          path: android/app/build/outputs/apk/huawei/debug/*.apk
          if-no-files-found: error

  ios:
    name: iOS simulator compile check
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Build unsigned simulator app
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: suixinji-ios-simulator-v1.0.3
          path: build/ios/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: error

